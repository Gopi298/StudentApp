<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Management System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 600px;
            background: white;
            padding: 50px 35px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
        }

        h1 {
            margin-bottom: 10px;
            color: #222;
        }

        .subtitle {
            color: #666;
            font-size: 18px;
            margin-bottom: 10px;
        }

        .version {
            color: #888;
            margin-bottom: 30px;
        }

        .download-btn {
            display: inline-block;
            background: #28a745;
            color: white;
            padding: 16px 35px;
            border-radius: 10px;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
        }

        .download-btn:hover {
            background: #218838;
        }

        .features {
            text-align: left;
            margin: 30px auto;
            max-width: 350px;
            color: #444;
        }

        .features li {
            margin: 10px 0;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Student Management System</h1>

        <div class="subtitle">
            Windows Desktop Application
        </div>

        <div class="version">
            Version 1.0
        </div>

        <ul class="features">
            <li>Add Student</li>
            <li>Update Student</li>
            <li>Delete Student</li>
            <li>Clear Student Details</li>
            <li>Student Management Table</li>
        </ul>

        <a
            class="download-btn"
            href="https://github.com/Gopi298/StudentApp/releases/latest/download/StudentApp.exe">
            DOWNLOAD WINDOWS APP
        </a>

    </div>

</body>
</html>
